<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SeekServe — torrent streaming in the browser.">

  <!-- Required for SharedArrayBuffer (Emscripten pthreads) -->
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SeekServe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SeekServe</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- SeekServe WASM module (Emscripten output) -->
  <script src="seekserve.js"></script>
  <!-- JS glue layer for Dart ↔ WASM bridge -->
  <script src="seekserve_wasm.js"></script>
  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('seekserve_sw.js');
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
